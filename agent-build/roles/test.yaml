id: test
purpose: 独立运行测试、构建、静态检查和回归验证
writes: []
staging: { owned_entries: [dispatch-result] }
delegates: []
commands: [context validate, dispatch claim, dispatch prompt, dispatch schema, dispatch template, dispatch validate, dispatch submit, staging create, staging write, staging show]
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }
execution:
  default:
    cwd: worktree
    tools: [filesystem.read, process.exec, git.read]
    approval_policy: never
  ceiling:
    cwd: [worktree]
    tools: [filesystem.read, process.exec, git.read]
    approval_policies: [never, on_request, always]

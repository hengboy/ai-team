id: file-explorer
purpose: 探索仓库文件、入口、依赖和测试
writes: []
staging: { owned_entries: [project-context, dispatch-result] }
delegates: []
commands: [context update, context validate, dispatch claim, dispatch prompt, dispatch schema, dispatch template, dispatch validate, dispatch submit, staging create, staging write, staging show]
discovery: true
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }
execution:
  default:
    cwd: project
    tools: [filesystem.read, process.exec, git.read]
    approval_policy: never
  ceiling:
    cwd: [project, worktree]
    tools: [filesystem.read, process.exec, git.read]
    approval_policies: [never, on_request, always]

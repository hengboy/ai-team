id: coding
purpose: 分流并协调实现、验证、评审、修复和集成工作
writes: []
delegates: [file-explorer, frontend-developer, backend-developer, test, git-operator, code-reviewer, researcher]
commands:
  - coding start
  - dispatch create
  - dispatch claim
  - dispatch prompt
  - dispatch schema
  - dispatch template
  - dispatch validate
  - dispatch submit
  - decision create
  - scope check
  - review create
  - review submit
  - review resolve
  - review status
  - run show
  - run resume
  - run decide
  - git status
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }

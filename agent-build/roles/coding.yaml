id: coding
purpose: 分流并协调实现、验证、评审、修复和集成工作
writes: []
staging: { owned_entries: [dispatch-packet, dispatch-result, decision, review-resolution] }
delegates: [file-explorer, frontend-developer, backend-developer, test, git-operator, code-reviewer, researcher]
commands:
  - coding start
  - context validate
  - dispatch create
  - dispatch claim
  - dispatch cancel
  - dispatch reissue
  - dispatch reconcile
  - dispatch supersede
  - dispatch prompt
  - dispatch schema
  - dispatch template
  - dispatch validate
  - dispatch submit
  - decision create
  - staging create
  - staging write
  - staging show
  - staging cleanup
  - scope check
  - review create
  - review submit
  - review resolve
  - review status
  - run show
  - run resume
  - run decide
  - git status
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }

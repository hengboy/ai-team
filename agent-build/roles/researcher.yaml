id: researcher
purpose: 研究外部事实并创建带引用的报告工件
writes: [dispatch.report_path]
staging: { owned_entries: [dispatch-result, research-conclusions] }
delegates: []
commands: [dispatch claim, dispatch prompt, dispatch schema, dispatch template, dispatch validate, dispatch submit, research archive, staging create, staging write, staging show]
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }
execution:
  default:
    cwd: project
    tools: [filesystem.read, process.exec, network]
    approval_policy: on_request
  ceiling:
    cwd: [project, worktree]
    tools: [filesystem.read, process.exec, network]
    approval_policies: [on_request, always]

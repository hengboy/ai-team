id: environment-operator
purpose: 安装、生成、切换、恢复和卸载受管理的全局文件
writes: [AI_TEAM_HOME, platform agent directories]
staging: { owned_entries: [] }
delegates: []
commands:
  - install
  - env list
  - env show
  - env validate
  - env explain
  - env diff
  - env edit
  - env generate
  - env switch
  - env status
  - env doctor
  - backup restore
  - uninstall
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }
execution:
  default:
    cwd: ai_team_home
    tools: [filesystem.read, filesystem.write, process.exec]
    approval_policy: on_request
  ceiling:
    cwd: [ai_team_home]
    tools: [filesystem.read, filesystem.write, process.exec]
    approval_policies: [on_request, always]

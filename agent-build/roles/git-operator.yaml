id: git-operator
purpose: 执行唯一允许的本地 Git 变更
writes: [git refs, .worktrees/**]
staging: { owned_entries: [dispatch-result, git-reconcile-evidence] }
delegates: []
commands:
  - planning revision commit
  - git status
  - git prepare
  - git adopt
  - git transfer
  - git recover-task-worktree
  - git commit
  - git merge-task
  - git continue-conflict
  - git continue-authority-conflict
  - git integrate
  - git reconcile
  - git cleanup
  - dispatch claim
  - dispatch prompt
  - dispatch template
  - dispatch submit
  - staging create
  - staging write
  - staging show
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }
execution:
  default:
    cwd: project
    tools: [filesystem.read, process.exec, git.read, git.write]
    approval_policy: on_request
  ceiling:
    cwd: [project, worktree]
    tools: [filesystem.read, filesystem.write, process.exec, git.read, git.write]
    approval_policies: [on_request, always]

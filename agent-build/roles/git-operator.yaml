id: git-operator
purpose: 执行唯一允许的本地 Git 变更
writes: [git refs, .worktrees/**]
staging: { owned_entries: [dispatch-result, git-reconcile-evidence] }
delegates: []
commands:
  - planning revision commit
  - git status
  - git prepare
  - git commit
  - git merge-task
  - git continue-conflict
  - git integrate
  - git reconcile
  - git cleanup
  - dispatch claim
  - dispatch prompt
  - dispatch template
  - dispatch submit
  - staging create
  - staging write
  - staging show
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }

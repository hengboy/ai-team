id: planning
purpose: 澄清需求并创建不可变的规划修订版本
writes: [.ai-team/plans/**]
staging: { owned_entries: [planning-documents, planning-tasks, dispatch-packet, dispatch-result, decision] }
delegates: [file-explorer, researcher]
commands:
  - planning start
  - planning revision create
  - planning revision transition
  - planning tasks validate
  - dispatch create
  - dispatch claim
  - dispatch prompt
  - dispatch schema
  - dispatch template
  - dispatch validate
  - dispatch submit
  - decision create
  - staging create
  - staging write
  - staging show
  - staging cleanup
  - run show
  - run resume
  - run decide
discovery: false
enforcement: { command_scope: mechanical, read_scope: instruction, write_scope: instruction }
